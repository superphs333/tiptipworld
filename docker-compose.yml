services:
  # 1) PHP 엔진: 라라벨 로직 실행 유닛임
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      args:
        INSTALL_XDEBUG: ${INSTALL_XDEBUG:-false}
    # 모든 이름을 tiptipworld로 통일함
    container_name: tiptipworld-php
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./src:/var/www/html
      - ./docker/php/conf.d/uploads.ini:/usr/local/etc/php/conf.d/90-uploads.ini
    ports:
      - "127.0.0.1:5174:5173"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      tiptip-internal:
        aliases:
          - tiptipworld-app

  # 2) 웹 서버: Nginx 환경임
  web:
    image: nginx:1.24-alpine
    container_name: tiptipworld-web
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    networks:
      - proxy-nw
      - tiptip-internal

  # 3) 데이터베이스: MariaDB 환경임
  db:
    image: mariadb:10.11
    container_name: tiptipworld-db
    restart: always
    environment:
      # .env 파일의 변수들도 tiptipworld 기준으로 매칭될 것임
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - tiptip_db_data:/var/lib/mysql # 데이터 저장소 이름 변경함
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tiptip-internal

  # 4) Redis: 캐시 관리임
  redis:
    image: redis:7.2-alpine
    container_name: tiptipworld-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - tiptip-internal

# 영구 보관용 볼륨 정의임
volumes:
  tiptip_db_data:

# 네트워크 설계임
networks:
  proxy-nw:
    external: true
  # 이 Compose 프로젝트에서 사용할 내부용 Bridge Network 
  tiptip-internal:
    driver: bridge
