  <path class="arrow" d="M470 300 L520 300"/>
  <text x="485" y="286" class="small">Y</text>
  <path class="arrow" d="M350 380 L350 520 L520 520"/>
  <text x="365" y="435" class="small">N</text>

  <text x="900" y="145" class="group">비로그인 플로우</text>
  <rect class="node" x="900" y="430" width="300" height="80"/>
  <text x="940" y="480" class="text">팁 목록/검색/상세</text>
  <rect class="node" x="1240" y="430" width="250" height="80"/>
  <text x="1310" y="480" class="text">유저 피드</text>
  <rect class="node" x="900" y="540" width="300" height="80"/>
  <text x="955" y="590" class="text">로그인/회원가입</text>
  <rect class="node" x="1240" y="540" width="250" height="80"/>
