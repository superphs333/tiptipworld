  <path class="arrow" d="M820 520 L900 470"/>
  <path class="arrow" d="M820 520 L900 580"/>
  <path class="arrow" d="M1200 580 L1240 580"/>

  <text x="900" y="690" class="group">로그인 사용자 핵심 플로우</text>
  <rect class="node" x="900" y="730" width="270" height="80"/>
