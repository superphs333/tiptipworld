  <rect class="node" x="1210" y="730" width="270" height="80"/>
  <text x="1260" y="780" class="text">좋아요/북마크</text>
  <rect class="node" x="1520" y="730" width="240" height="80"/>
  <text x="1570" y="780" class="text">댓글 기능</text>

  <rect class="node" x="900" y="840" width="270" height="80"/>
  <text x="980" y="890" class="text">팔로우</text>
  <rect class="node" x="1210" y="840" width="270" height="80"/>
  <text x="1280" y="890" class="text">마이페이지</text>
  <rect class="node" x="1520" y="840" width="240" height="80"/>
  <text x="1570" y="890" class="text">프로필 관리</text>

  <path class="arrow" d="M820 300 L900 770"/>

