  <path class="arrow" d="M520 300 L210 730"/>
  <path class="arrow" d="M350 770 L390 770"/>
  <path class="arrow" d="M350 780 L390 880"/>

  <text x="70" y="1010" class="small">* auth 미들웨어: 글작성/좋아요/북마크/댓글/팔로우/마이페이지 접근 필요</text>
  <text x="70" y="1040" class="small">* admin 미들웨어: /admin 하위 기능 접근 필요</text>
  <text x="70" y="1070" class="small">* 팁 상세: 비작성자/비관리자는 published + public만 접근 가능</text>
</svg>
