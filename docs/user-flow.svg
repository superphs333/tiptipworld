<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100">
  <defs>
    <style>
      .title { font: 700 42px 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; fill: #111827; }
      .node { fill: #ffffff; stroke: #9ca3af; stroke-width: 2; rx: 12; ry: 12; }
      .decision { fill: #f9fafb; stroke: #6b7280; stroke-width: 2; }
      .text { font: 500 24px 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; fill: #111827; }
      .small { font: 500 20px 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; fill: #374151; }
      .arrow { stroke: #6b7280; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .group { font: 700 26px 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; fill: #2563eb; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280" />
    </marker>
  </defs>

  <text x="70" y="80" class="title">TipTipWorld 유저 플로우 (코드 분석 기반)</text>

  <text x="70" y="145" class="group">공통 진입</text>
  <polygon class="decision" points="350,220 470,300 350,380 230,300" />
  <text x="300" y="295" class="text">로그인</text>
  <text x="300" y="330" class="text">상태 확인</text>

  <rect class="node" x="520" y="250" width="300" height="100" rx="18" ry="18"/>
