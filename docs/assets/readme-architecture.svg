<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">TipTipWorld system architecture</title>
  <desc id="desc">Browser requests flow through Nginx to Laravel PHP-FPM. Laravel uses MariaDB, Redis, R2 storage, Google and Kakao OAuth, and Vite assets.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .panel-soft { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .box-dark { fill: #1f2937; stroke: #111827; stroke-width: 2; }
      .box-accent { fill: #ecfdf5; stroke: #047857; stroke-width: 2; }
      .box-warn { fill: #fffbeb; stroke: #b45309; stroke-width: 2; }
      .box-info { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Arial, sans-serif; fill: #475569; }
      .label { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .label-light { font: 700 16px Arial, sans-serif; fill: #ffffff; }
      .text { font: 400 13px Arial, sans-serif; fill: #334155; }
      .text-light { font: 400 13px Arial, sans-serif; fill: #e5e7eb; }
      .small { font: 400 12px Arial, sans-serif; fill: #64748b; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow-soft); stroke-dasharray: 6 5; }
      .group-title { font: 700 14px Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="720" rx="0" />
  <text class="title" x="50" y="56">TipTipWorld Architecture</text>
  <text class="subtitle" x="50" y="82">Docker 기반 Laravel 서비스의 요청 흐름, 애플리케이션 경계, 외부 연동 구조</text>

  <rect class="panel" x="40" y="112" width="250" height="500" rx="14" />
  <text class="group-title" x="64" y="146">Client</text>
  <rect class="box-info" x="70" y="178" width="190" height="76" rx="12" />
  <text class="label" x="104" y="209">Browser</text>
  <text class="text" x="94" y="232">Blade HTML, CSS, JS</text>
  <rect class="box" x="70" y="292" width="190" height="86" rx="12" />
  <text class="label" x="101" y="324">Vite Assets</text>
  <text class="text" x="92" y="348">app.css, app.js</text>
  <text class="text" x="94" y="366">screen components</text>

  <rect class="panel" x="340" y="112" width="420" height="500" rx="14" />
  <text class="group-title" x="364" y="146">Docker services</text>
  <rect class="box-dark" x="385" y="178" width="280" height="78" rx="12" />
  <text class="label-light" x="482" y="210">Nginx</text>
  <text class="text-light" x="442" y="233">web container</text>
  <rect class="box-accent" x="385" y="304" width="280" height="126" rx="12" />
  <text class="label" x="459" y="336">Laravel 12 App</text>
  <text class="text" x="424" y="362">PHP-FPM container</text>
  <text class="text" x="426" y="384">Routes, Controllers, Services</text>
  <text class="text" x="430" y="406">Blade, Policies, Requests</text>
  <rect class="box-purple" x="385" y="482" width="280" height="82" rx="12" />
  <text class="label" x="442" y="515">Domain Services</text>
  <text class="text" x="416" y="540">TipRead, TipWrite, Media, Social</text>

  <rect class="panel" x="810" y="112" width="320" height="500" rx="14" />
  <text class="group-title" x="834" y="146">Persistence and providers</text>
  <rect class="box-warn" x="850" y="178" width="240" height="72" rx="12" />
  <text class="label" x="932" y="210">MariaDB</text>
  <text class="text" x="896" y="233">users, tips, comments</text>
  <rect class="box-warn" x="850" y="282" width="240" height="70" rx="12" />
  <text class="label" x="944" y="313">Redis</text>
  <text class="text" x="912" y="336">cache / queue support</text>
  <rect class="box-info" x="850" y="384" width="240" height="72" rx="12" />
  <text class="label" x="936" y="416">R2 / S3</text>
  <text class="text" x="894" y="439">profile, thumbnail, editor images</text>
  <rect class="box-purple" x="850" y="488" width="240" height="76" rx="12" />
  <text class="label" x="912" y="520">Google / Kakao</text>
  <text class="text" x="900" y="543">OAuth login and account link</text>

  <path class="arrow" d="M260 216 L382 216" />
  <path class="arrow" d="M525 256 L525 300" />
  <path class="arrow" d="M525 430 L525 478" />
  <path class="arrow" d="M666 344 C735 344, 770 214, 846 214" />
  <path class="arrow" d="M666 368 C735 368, 772 318, 846 318" />
  <path class="arrow" d="M666 392 C740 392, 772 420, 846 420" />
  <path class="arrow" d="M666 516 C738 516, 772 526, 846 526" />
  <path class="arrow-soft" d="M260 334 C318 334, 320 530, 382 530" />

  <rect class="panel-soft" x="50" y="644" width="1080" height="42" rx="10" />
  <text class="small" x="70" y="670">Request path: Browser -> Nginx -> Laravel Controllers -> Services -> MariaDB/Redis/R2/OAuth. Static assets are compiled by Vite and served through the Laravel public build output.</text>
</svg>
